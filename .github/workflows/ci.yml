name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      NEXTAUTH_SECRET: build-verification-only-secret
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_build_verification_only
      STRIPE_WEBHOOK_SECRET: whsec_build_verification_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
